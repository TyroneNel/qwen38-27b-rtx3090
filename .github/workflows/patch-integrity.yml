name: patch integrity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check model verification and selection without a GPU
        run: python bench/test_model_verification.py

  git-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check repository
        uses: actions/checkout@v4

      - name: Check pinned vLLM source
        uses: actions/checkout@v4
        with:
          repository: vllm-project/vllm
          ref: v0.28.0
          path: .ci/vllm
          fetch-depth: 1

      - name: Validate patch series with git apply
        run: bash patches/check_vllm_series.sh .ci/vllm/vllm
