name: patch integrity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check model verification and selection without a GPU
        run: python bench/test_model_verification.py
      - name: Check state detection crash resilience without a GPU
        run: python bench/test_prepare_state.py
      - name: Check the MQ-3D split-KV capacity property holds without a GPU
        run: python bench/mq3d_capacity_property.py
      - name: Check the capacity property test still catches a broken derivation
        run: python bench/mq3d_capacity_property.py --mutate seq-rows
      - name: Check verbatim answer classification without a GPU
        run: python bench/verbatim.py
      - name: Check a launcher with no API key binds 127.0.0.1
        run: bash bench/test_no_key_bind.sh

  kvarn-torch-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The fp16-dequant numerics gate is pure torch (no vLLM, no GPU) and works with any
      # torch build, so the job takes the current CPU wheel and has no pin to bump with vLLM.
      - name: Install CPU torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Check the KVARN_FP16_DEQUANT numerics gate without a GPU
        run: python kvarn/tests/test_kvarn_fp16_dequant_torch.py

  git-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check repository
        uses: actions/checkout@v4

      # The series is checked against the pin the image installs, read from docker/requirements.txt,
      # so a pin bump and its regenerated patches are judged together instead of against a stale tag.
      - name: Read the vLLM pin
        id: pin
        run: echo "tag=v$(grep -E '^vllm==' docker/requirements.txt | cut -d= -f3)" >> "$GITHUB_OUTPUT"

      - name: Check pinned vLLM source
        uses: actions/checkout@v4
        with:
          repository: vllm-project/vllm
          ref: ${{ steps.pin.outputs.tag }}
          path: .ci/vllm
          fetch-depth: 1

      - name: Validate patch series with git apply
        run: bash patches/check_vllm_series.sh .ci/vllm/vllm
